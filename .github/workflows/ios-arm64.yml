name: iOS arm64

# Cross-builds everything for iPhoneOS/arm64 that does not need game data. The runtime itself links
# the recompiled game code, which is generated from a private default.xex; game data never enters
# this public workflow, so the runtime link is not attempted here (see docs/IOS_PORT.md).

on:
  workflow_dispatch:
  push:
    branches: [ios-port]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ios-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: iOS dependencies (no game data)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install build tools
        run: |
          brew install ninja
          python -m pip install numpy pillow
      - name: Apply dependency patches
        run: |
          git -C tools/XenonRecomp apply --reverse --check ../patches/XenonRecomp-lostodyssey.patch >/dev/null 2>&1 || git -C tools/XenonRecomp apply ../patches/XenonRecomp-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-lostodyssey.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-lostodyssey.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-sdl3.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-sdl3.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-macos.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-macos.patch
          git -C thirdparty/plume apply --reverse --check ../../tools/patches/plume-ios.patch >/dev/null 2>&1 || git -C thirdparty/plume apply ../../tools/patches/plume-ios.patch
      - name: Configure (iPhoneOS arm64)
        shell: bash
        run: |
          cmake -S . -B out/build/ios -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DLO_BUILD_RECOMP_LIB=OFF 2>&1 | tee out-configure.log
      - name: Report configure errors as annotations
        if: failure()
        run: |
          python3 - <<'PYX'
          import re, os
          def emit(title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=" + title + "::" + text[:60000])
          path = "out-configure.log"
          lines = open(path, errors="replace").read().splitlines() if os.path.exists(path) else ["(no log)"]
          hits = [l for l in lines if re.search(r"(CMake Error|error:|FAILED:|fatal error|undefined symbol|ld: )", l)]
          emit("configure-errors", "\n".join(hits[:80]) if hits else "no error lines")
          emit("configure-tail", "\n".join(lines[-60:]))
          PYX
      - name: Build libraries (no game data)
        run: |
          set +e
          ninja -C out/build/ios -k 0 plume spirv-cross-msl SDL3-static XenonUtils lo_portable_shader_pack lo_menu_lzo \
            lo_avcodec lo_avutil o1heap 2>&1 | tee ios-build.log
          status=${PIPESTATUS[0]}
          grep -E "FAILED:|error:" ios-build.log | head -60
          exit $status
      - name: Report build errors as annotations
        if: failure()
        run: |
          python3 - <<'PYX'
          import re, os
          def emit(title, text):
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=" + title + "::" + text[:60000])
          path = "ios-build.log"
          lines = open(path, errors="replace").read().splitlines() if os.path.exists(path) else ["(no log)"]
          hits = [l for l in lines if re.search(r"(CMake Error|error:|FAILED:|fatal error|undefined symbol|ld: )", l)]
          emit("build-errors", "\n".join(hits[:80]) if hits else "no error lines")
          emit("build-tail", "\n".join(lines[-60:]))
          PYX
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-deps-logs
          path: |
            out-configure.log
            ios-build.log
